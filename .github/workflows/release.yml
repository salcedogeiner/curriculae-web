# Builds the desktop executables for Linux, Windows and macOS and publishes
# them as a GitHub Release when a version tag (v*) is pushed.
#
# macOS binaries can only be built on macOS, so each platform builds on its own
# runner. The binaries are not code-signed: there is no certificate in this repo
# by design (AGENTS.md §1.6), and the release notes explain the one-time
# "open anyway" step each OS asks for.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
      - run: npm run test:desktop
      - run: npm run typecheck:desktop

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            targets: --linux AppImage deb
          - name: windows
            os: windows-latest
            targets: --win nsis portable
          - name: macos
            os: macos-latest
            targets: --mac dmg zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          # No signing identity: never pick one up from the runner keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: curriculae-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Curriculae ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: artifacts/*
