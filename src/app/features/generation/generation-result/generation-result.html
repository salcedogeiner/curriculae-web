@if (live()) {
  <section class="result" aria-labelledby="draft-title">
    <h2 class="result__title" id="draft-title">{{ i18n.t('result.draftTitle') }}</h2>
    <app-adapted-preview [markdown]="generation.draft()" [live]="true" />
  </section>
} @else if (generation.result(); as result) {
  <section class="result" aria-labelledby="result-title">
    <header class="result__head">
      <app-step-heading
        [step]="3"
        [title]="i18n.t('result.title')"
        [lead]="meta() + baseCvLabel()"
        headingId="result-title"
      />
    </header>

    <div class="result__grid">
      <div class="result__main">
        <h3 class="result__subtitle">{{ i18n.t('adapted.title') }}</h3>
        <app-adapted-preview [markdown]="result.adaptedCv" [unverified]="result.unverified" />
      </div>

      <aside class="result__aside">
        @if (exportSource(); as source) {
          <app-export-actions [source]="source" />
        }
        <app-analysis-report [analysis]="result.analysis" />
        <details class="result__vacancy">
          <summary>{{ i18n.t('result.vacancy') }}</summary>
          <pre class="result__vacancy-text" tabindex="0">{{ result.vacancyText }}</pre>
        </details>
      </aside>
    </div>
  </section>
}
