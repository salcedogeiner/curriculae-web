<div class="home">
  <div class="home__steps">
    <section class="home__column" aria-labelledby="cv-step-title">
      <app-step-heading
        class="home__title"
        [step]="1"
        [title]="i18n.t('cv.stepTitle')"
        [lead]="i18n.t('cv.stepLead')"
        headingId="cv-step-title"
      />

      @if (cv(); as loaded) {
        <app-cv-preview
          [text]="loaded.text"
          [charCount]="loaded.charCount"
          [fileName]="loaded.fileName"
        />
      }

      <app-cv-dropzone />
    </section>

    <section class="home__column" aria-labelledby="vacancy-step-title">
      <app-generation-form />
    </section>
  </div>

  <app-generation-result />
</div>
